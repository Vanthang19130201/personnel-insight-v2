<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173a32">

  <title>Thống kê nhân sự đơn vị | Quân khu</title>

  <!-- CSS chính -->
  <link rel="stylesheet" href="styles.css">

  <!-- Tính lương -->
  <link rel="stylesheet" href="salary-calculator.css">

  <!-- Tổng hợp nơi ở + quân hàm -->
  <link rel="stylesheet" href="residence-rank-report.css">

  <!-- JavaScript -->
  <script src="template-report.js" defer></script>
  <script src="app.js" defer></script>
  <script src="salary-calculator.js" defer></script>
  <script src="residence-rank-report.js" defer></script>
</head>

<body>

<div class="app-shell">

  <!-- =========================
       SIDEBAR
  ========================== -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-icon military-brand" aria-hidden="true">
        <span class="military-star">★</span>
      </div>

      <div>
        <strong>PERSONNEL <em>INSIGHT</em></strong>
        <small>Nhập Số liệu · Tổng hợp tự động</small>
      </div>
    </div>


    <div class="sidebar-label">
      QUẢN LÝ
    </div>

    <nav aria-label="Điều hướng">

      <button
              class="nav-link active"
              data-page="dashboard">
        <span>▦</span>
        Tổng quan
      </button>

      <button
              class="nav-link"
              data-page="people">
        <span>♙</span>
        Hồ sơ nhân sự
      </button>

      <button
              class="nav-link"
              data-page="statistics">
        <span>◫</span>
        Thống kê chuyên sâu
      </button>

      <button
              class="nav-link"
              data-page="source">
        <span>▥</span>
        Tổng hợp theo mẫu báo cáo
      </button>

      <button
              class="nav-link"
              data-salary-page="salary">

  <span class="nav-calc-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2"></rect>
      <rect x="8" y="6" width="8" height="4" rx="1"></rect>

      <path d="M8 14h1"></path>
      <path d="M12 14h1"></path>
      <path d="M16 14h1"></path>

      <path d="M8 18h1"></path>
      <path d="M12 18h1"></path>
      <path d="M16 18h1"></path>
    </svg>
  </span>

        Tính lương
      </button>

      <button
              class="nav-link"
              data-page="payroll">
        <span>₫</span>
        Quỹ lương & thu nhập
      </button>

      <button
              class="nav-link"
              data-page="reports">
        <span>▤</span>
        Báo cáo & xuất dữ liệu
      </button>

    </nav>


    <div class="sidebar-label">
      HỆ THỐNG
    </div>

    <nav aria-label="Công cụ">

      <button
              class="nav-link"
              data-page="settings">
        <span>⚙</span>
        Thiết lập dữ liệu
      </button>

    </nav>


    <div class="sidebar-bottom">

      <div class="online-dot"></div>

      <div>
        <b>Bản demo cá nhân</b>
        <small>Demo ngoại tuyến · dữ liệu tự nhập</small>
      </div>

    </div>

  </aside>


  <!-- =========================
       MAIN
  ========================== -->
  <div class="main-layout">

    <header class="topbar">

      <div class="top-left">

        <button
                id="menuToggle"
                class="icon-btn menu-toggle"
                aria-label="Mở menu">
          ☰
        </button>

        <span class="crumb">
          Không gian quản lý
        </span>

        <span class="slash">
          /
        </span>

        <strong id="breadcrumb">
          Tổng quan
        </strong>

      </div>


      <div class="top-actions">

        <span
                class="header-date"
                id="todayLabel">
        </span>

        <button
                class="btn btn-light btn-sm"
                id="logoutButton"
                type="button">
          Đăng xuất
        </button>

        <span class="avatar">
          QT
        </span>

      </div>

    </header>


    <main
            id="main"
            class="content"
            tabindex="-1">
    </main>

  </div>

</div>


<!-- =========================================================
     MODAL THÊM / SỬA HỒ SƠ
========================================================== -->
<div
        class="modal-layer hidden"
        id="personModal"
        role="presentation">

  <div
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modalTitle">


    <!-- HEADER MODAL -->
    <div class="modal-head">

      <div>

        <span class="eyebrow">
          HỒ SƠ NHÂN SỰ
        </span>

        <h2 id="modalTitle">
          Thêm hồ sơ
        </h2>

      </div>


      <button
              class="icon-btn"
              id="closeModal"
              type="button"
              aria-label="Đóng">
        ✕
      </button>

    </div>


    <!-- FORM -->
    <form
            id="personForm"
            novalidate>


      <div class="form-scroll">

        <div class="form-grid">


          <!-- MÃ NHÂN SỰ -->
          <div class="field">

            <label for="personCode">
              Mã nhân sự <b>*</b>
            </label>

            <input
                    id="personCode"
                    name="code"
                    required
                    maxlength="30"
                    placeholder="NS-001">

          </div>


          <!-- HỌ TÊN -->
          <div class="field">

            <label for="personName">
              Họ và tên <b>*</b>
            </label>

            <input
                    id="personName"
                    name="name"
                    required
                    maxlength="100"
                    placeholder="Nguyễn Văn A">

          </div>


          <!-- NGÀY SINH -->
          <div class="field">

            <label for="personDOB">
              Ngày sinh <b>*</b>
            </label>

            <input
                    id="personDOB"
                    type="date"
                    name="dob"
                    required>

          </div>


          <!-- GIỚI TÍNH -->
          <div class="field">

            <label for="personGender">
              Giới tính
            </label>

            <select
                    id="personGender"
                    name="gender">

              <option>Nam</option>
              <option>Nữ</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- NHÓM QUẢN LÝ -->
          <div class="field">

            <label for="personGroup">
              Nhóm quản lý
            </label>

            <select
                    name="group"
                    id="personGroup">

              <option>Tổ A</option>
              <option>Tổ B</option>
              <option>Tổ C</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- QUÂN HÀM -->
          <div class="field">

            <label for="personRank">
              Quân hàm / cấp bậc
            </label>

            <input
                    id="personRank"
                    name="rank"
                    list="rankOptions"
                    maxlength="35"
                    placeholder="Ví dụ: Đại úy">

            <datalist id="rankOptions">

              <!-- HSQ / CS -->
              <option value="Binh nhì">
              <option value="Binh nhất">
              <option value="Hạ sĩ">
              <option value="Trung sĩ">
              <option value="Thượng sĩ">

                <!-- SĨ QUAN -->
              <option value="Thiếu úy">
              <option value="Trung úy">
              <option value="Thượng úy">
              <option value="Đại úy">

              <option value="Thiếu tá">
              <option value="Trung tá">
              <option value="Thượng tá">
              <option value="Đại tá">

              <option value="Thiếu tướng">
              <option value="Trung tướng">
              <option value="Thượng tướng">
              <option value="Đại tướng">

                <!-- QNCN -->
              <option value="Thiếu úy QNCN">
              <option value="Trung úy QNCN">
              <option value="Thượng úy QNCN">
              <option value="Đại úy QNCN">
              <option value="Thiếu tá QNCN">
              <option value="Trung tá QNCN">
              <option value="Thượng tá QNCN">

            </datalist>

          </div>


          <!-- CHỨC VỤ -->
          <div class="field">

            <label for="personPosition">
              Chức vụ <b>*</b>
            </label>

            <input
                    id="personPosition"
                    name="position"
                    required
                    maxlength="100"
                    placeholder="Nhân viên">

          </div>


          <!-- TRÌNH ĐỘ VĂN HÓA -->
          <div class="field">

            <label for="personEducation">
              Trình độ văn hóa
            </label>

            <select
                    id="personEducation"
                    name="education">

              <option value="">
                Chưa cập nhật
              </option>

              <option>12/12</option>
              <option>11/12</option>
              <option>10/12</option>
              <option>9/12</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- TRÌNH ĐỘ CHUYÊN MÔN -->
          <div class="field">

            <label for="personQualification">
              Trình độ chuyên môn
            </label>

            <select
                    id="personQualification"
                    name="qualification">

              <option value="">
                Chưa cập nhật
              </option>

              <option>THPT</option>
              <option>Sơ cấp</option>
              <option>Trung cấp</option>
              <option>Cao đẳng</option>
              <option>Đại học</option>
              <option>Sau đại học</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- HÔN NHÂN -->
          <div class="field">

            <label for="personMarriage">
              Tình trạng hôn nhân
            </label>

            <select
                    id="personMarriage"
                    name="marital">

              <option value="">
                Chưa cập nhật
              </option>

              <option>Chưa kết hôn</option>
              <option>Đã kết hôn</option>
              <option>Ly hôn</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- ĐỐI TƯỢNG -->
          <div class="field">

            <label for="personCategory">
              Đối tượng quân nhân
            </label>

            <select
                    id="personCategory"
                    name="category">

              <option value="">
                Chưa cập nhật
              </option>

              <option>Sĩ quan</option>
              <option>Quân nhân chuyên nghiệp</option>
              <option>Hạ sĩ quan</option>
              <option>Chiến sĩ</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- DÂN TỘC -->
          <div class="field">

            <label for="personEthnicity">
              Dân tộc
            </label>

            <input
                    id="personEthnicity"
                    name="ethnicity"
                    maxlength="60"
                    placeholder="Ví dụ: Kinh">

          </div>


          <!-- TÔN GIÁO -->
          <div class="field">

            <label for="personReligion">
              Tôn giáo
            </label>

            <select
                    id="personReligion"
                    name="religion">

              <option value="">
                Chưa cập nhật
              </option>

              <option>Không</option>
              <option>Phật giáo</option>
              <option>Công giáo</option>
              <option>Tin lành</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- ĐẢNG / ĐOÀN -->
          <div class="field">

            <label for="personOrganization">
              Đảng / Đoàn
            </label>

            <select
                    id="personOrganization"
                    name="organization">

              <option value="">
                Chưa cập nhật
              </option>

              <option>Đảng viên</option>
              <option>Đoàn viên</option>
              <option>Chưa tham gia</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- GIA ĐÌNH -->
          <div class="field">

            <label for="personFamily">
              Gia đình (chỉ phân loại chung)
            </label>

            <select
                    id="personFamily"
                    name="family">

              <option value="">
                Chưa cập nhật
              </option>

              <option>Bình thường</option>
              <option>Hoàn cảnh khó khăn</option>
              <option>Cần quan tâm</option>
              <option>Khác</option>

            </select>

          </div>


          <!-- NƠI Ở HIỆN NAY -->
          <div class="field">

            <label for="personResidence">
              Nơi ở hiện nay (xã/phường)
            </label>

            <input
                    id="personResidence"
                    name="residence"
                    maxlength="70"
                    placeholder="Ví dụ: Xã Nam Đà">

          </div>


          <!-- SỐ CON -->
          <div class="field">

            <label for="personChildren">
              Số con
            </label>

            <input
                    id="personChildren"
                    type="number"
                    name="children"
                    min="0"
                    max="20"
                    step="1"
                    value="0">

          </div>


          <!-- THÂM NIÊN -->
          <div class="field">

            <label for="personYears">
              Thâm niên (năm)
            </label>

            <input
                    id="personYears"
                    type="number"
                    name="years"
                    min="0"
                    max="65"
                    step="1"
                    value="0">

          </div>


          <!-- LƯƠNG -->
          <div class="field">

            <label for="personSalary">
              Lương tháng (VNĐ)
            </label>

            <input
                    id="personSalary"
                    type="number"
                    name="salary"
                    min="0"
                    max="1000000000"
                    step="1000"
                    value="0">

          </div>


          <!-- PHỤ CẤP -->
          <div class="field">

            <label for="personAllowance">
              Phụ cấp tháng (VNĐ)
            </label>

            <input
                    id="personAllowance"
                    type="number"
                    name="allowance"
                    min="0"
                    max="1000000000"
                    step="1000"
                    value="0">

          </div>


          <!-- GHI CHÚ -->
          <div class="field wide">

            <label for="personNote">
              Ghi chú chung
            </label>

            <textarea
                    id="personNote"
                    name="note"
                    rows="2"
                    maxlength="300"
                    placeholder="Ghi chú tùy chọn"></textarea>

          </div>


        </div>


        <p
                class="form-help"
                id="formError"
                role="alert">
        </p>

      </div>


      <!-- BUTTON -->
      <div class="modal-actions">

        <button
                type="button"
                class="btn btn-ghost"
                id="cancelModal">
          Hủy
        </button>

        <button
                type="submit"
                class="btn btn-primary">
          Lưu hồ sơ
        </button>

      </div>

    </form>

  </div>

</div>


<!-- TOAST -->
<div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite">
</div>

</body>
</html>
